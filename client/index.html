<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060911" />
  <meta name="description"
    content="SCAMGUARD AI - Enterprise-grade AI-powered Social Media Scam and Phishing Threat Detection System" />
  <title>SCAMGUARD AI | Social Media Threat Intelligence</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-[#060911] text-slate-100 min-h-screen antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <noscript>
    <div
      style="min-height: 100vh; background: #060911; color: #f87171; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
      <div
        style="max-width: 500px; background: #0f172a; border: 1px solid #ef4444; border-radius: 12px; padding: 24px;">
        <h2 style="margin-top: 0; color: #f87171;">JavaScript Required</h2>
        <p style="color: #94a3b8; font-size: 14px;">JavaScript is required to run the SCAMGUARD AI Security Operations
          Center. Please enable JavaScript in your browser to continue.</p>
      </div>
    </div>
  </noscript>

  <!-- Guard against direct file:// double-click launches and auto-redirect once localhost server is up -->
  <script>
    if (window.location.protocol === 'file:') {
      function checkAndRedirect() {
        fetch('http://localhost:8080/api/health')
          .then(function (r) {
            if (r.ok) {
              window.location.href = 'http://localhost:8080';
            }
          })
          .catch(function () {});
      }
      checkAndRedirect();
      setInterval(checkAndRedirect, 1500);

      window.addEventListener('DOMContentLoaded', function () {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="min-height:100vh;background:#060911;color:#F1F5F9;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;"><div style="max-width:580px;background:rgba(15,23,42,0.95);border:1px solid rgba(6,182,212,0.4);border-radius:16px;padding:36px;box-shadow:0 0 30px rgba(6,182,212,0.15);"><div style="margin-bottom:16px;"><img src="public/logo.png" style="width:56px;height:56px;object-fit:contain;" onerror="this.style.display=\'none\'"/></div><h1 style="font-size:20px;font-weight:800;color:#38bdf8;margin:0 0 10px;font-family:monospace;letter-spacing:1px;">SCAMGUARD AI — SERVER REQUIRED</h1><p style="font-size:13px;color:#94a3b8;line-height:1.6;margin-bottom:20px;">Modern React + Vite applications cannot run directly as static files (<code>file://</code>) and require the local server process to be running in a terminal.</p><div style="background:#020617;border:1px solid #1e293b;border-radius:10px;padding:14px;font-family:monospace;font-size:12px;color:#06b6d4;text-align:left;margin-bottom:20px;"><div style="color:#64748b;font-size:11px;margin-bottom:4px;"># Step 1: In the project folder, run start.bat or:</div><div style="color:#f8fafc;font-weight:bold;margin-bottom:8px;">npm run dev</div><div style="color:#64748b;font-size:11px;margin-bottom:4px;"># Step 2: Keep the terminal open, then navigate to:</div><div style="color:#38bdf8;font-weight:bold;">http://localhost:8080</div></div><p style="font-size:12px;color:#38bdf8;margin-bottom:20px;line-height:1.5;">Auto-detecting local server... This page will automatically redirect as soon as the server is listening.</p><a href="http://localhost:8080" style="display:inline-block;background:linear-gradient(to right,#06b6d4,#3b82f6);color:#040e18;text-decoration:none;font-weight:700;font-size:13px;padding:12px 24px;border-radius:10px;letter-spacing:0.5px;box-shadow:0 0 20px rgba(6,182,212,0.3);">Launch http://localhost:8080</a></div></div>';
        }
      });
    }
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
